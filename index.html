<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapay Zekâ Kartları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a65;
    --line: #e4e2dc;
    --accent: #3b5bdb;
    --accent-soft: #e7ecff;
    --good: #2b8a3e;
    --good-soft: #e3f4e6;
    --again: #c2410c;
    --again-soft: #fdeee4;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1d;
      --text: #ecebe6;
      --muted: #9d9b94;
      --line: #33322f;
      --accent: #8ca2ff;
      --accent-soft: #252c47;
      --good: #6fcf86;
      --good-soft: #1d3324;
      --again: #f59e6b;
      --again-soft: #3a2519;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  main { width: 100%; max-width: 640px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: .92rem; margin: 0; }

  .stats {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin: 18px 0 10px; font-size: .85rem;
  }
  .pill {
    padding: 5px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.good b { color: var(--good); }
  .pill.again b { color: var(--again); }

  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; width: 0; background: var(--good); transition: width .3s ease; }

  .scene { perspective: 1400px; }
  .card {
    position: relative; width: 100%; min-height: 300px;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1);
    cursor: pointer; outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 28px 24px 44px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  .face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: transparent; }
  .label {
    position: absolute; top: 14px; left: 18px;
    font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .num { position: absolute; top: 14px; right: 18px; font-size: .78rem; color: var(--muted); }
  .hint { position: absolute; bottom: 14px; font-size: .78rem; color: var(--muted); }
  .q { font-size: 1.3rem; font-weight: 600; line-height: 1.4; }
  .a { font-size: 1.15rem; line-height: 1.5; }
  .card:focus-visible .face { outline: 3px solid var(--accent); outline-offset: 3px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  button {
    font: inherit; font-size: .95rem; font-weight: 600;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    padding: 12px 14px; border-radius: 12px; cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: default; }
  .btn-again { background: var(--again-soft); color: var(--again); border-color: transparent; }
  .btn-good { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .btn-flip { grid-column: 1 / -1; background: var(--accent); color: #fff; border-color: transparent; }
  @media (prefers-color-scheme: dark) { .btn-flip { color: #10152b; } }

  .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .nav button { font-weight: 500; font-size: .85rem; padding: 8px 12px; }

  .keys { margin-top: 18px; font-size: .78rem; color: var(--muted); text-align: center; }
  kbd {
    font-family: inherit; font-size: .72rem; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--surface);
  }
  @media (hover: none) { .keys { display: none; } }

  .done {
    display: none; text-align: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 36px 24px; box-shadow: var(--shadow);
  }
  .done h2 { margin: 0 0 8px; }
  .done p { color: var(--muted); margin: 0 0 20px; }
  .done .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .error { color: var(--again); }

  @media (max-width: 480px) {
    .card { min-height: 260px; }
    .q { font-size: 1.12rem; }
    .a { font-size: 1.02rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Yapay Zekâ Kartları</h1>
    <p class="sub">Soruyu oku, cevabı düşün, kartı çevir. Bildiklerin desteden çıkar, bilmediklerin tekrar gelir.</p>
  </header>

  <div class="stats">
    <span class="pill">Kalan <b id="sLeft">0</b></span>
    <span class="pill good">Biliyorum <b id="sGood">0</b></span>
    <span class="pill again">Tekrar <b id="sAgain">0</b></span>
    <span class="pill">Toplam <b id="sTotal">0</b></span>
  </div>
  <div class="bar"><div id="bar"></div></div>

  <section id="study">
    <div class="scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Kartı çevir">
        <div class="face front">
          <span class="label">Soru</span><span class="num" id="numF"></span>
          <div class="q" id="q">Kartlar yükleniyor…</div>
          <span class="hint">Cevabı görmek için dokun</span>
        </div>
        <div class="face back">
          <span class="label">Cevap</span><span class="num" id="numB"></span>
          <div class="a" id="a"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-flip" id="flipBtn">Cevabı göster</button>
      <button class="btn-again" id="againBtn" disabled>Tekrar sor</button>
      <button class="btn-good" id="goodBtn" disabled>Biliyorum</button>
    </div>

    <div class="nav">
      <button id="shuffleBtn">Karıştır</button>
      <button id="resetBtn">Baştan başla</button>
    </div>
    <p class="keys"><kbd>Boşluk</kbd> çevir · <kbd>1</kbd> tekrar sor · <kbd>2</kbd> biliyorum</p>
  </section>

  <section class="done" id="done">
    <h2>Tebrikler! 🎉</h2>
    <p id="doneText"></p>
    <div class="row">
      <button class="btn-flip" id="restartBtn" style="grid-column:auto">Tekrar çalış</button>
    </div>
  </section>
</main>

<script>
const STORE = "yz-kartlar-v1";
let cards = [], queue = [], good = 0, again = 0, flipped = false;

const $ = id => document.getElementById(id);

function parseCSV(text) {
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length >= 2 && r[0].trim())
             .map(r => ({ q: r[0].trim(), a: r[1].trim() }));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ n: cards.length, queue, good, again })); } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && s.n === cards.length && Array.isArray(s.queue)) { queue = s.queue; good = s.good; again = s.again; return true; }
  } catch (e) {}
  return false;
}

function start(doShuffle) {
  queue = cards.map((_, i) => i);
  if (doShuffle) shuffle(queue);
  good = 0; again = 0;
  save(); render();
}

function setFlip(v) {
  flipped = v;
  $("card").classList.toggle("flipped", v);
  $("flipBtn").textContent = v ? "Soruya dön" : "Cevabı göster";
  $("againBtn").disabled = $("goodBtn").disabled = !v;
}

function render() {
  const total = cards.length;
  $("sLeft").textContent = queue.length;
  $("sGood").textContent = good;
  $("sAgain").textContent = again;
  $("sTotal").textContent = total;
  $("bar").style.width = total ? ((total - queue.length) / total * 100) + "%" : "0";

  if (!queue.length) {
    $("study").style.display = "none";
    $("done").style.display = "block";
    $("doneText").textContent = `${total} kartın hepsini tamamladın. Toplam ${again} kez "tekrar sor" dedin.`;
    return;
  }
  $("study").style.display = "";
  $("done").style.display = "none";
  // Reset flip without animating so the next answer isn't revealed mid-turn
  const card = $("card");
  card.style.transition = "none"; setFlip(false); void card.offsetWidth; card.style.transition = "";
  const c = cards[queue[0]], n = `#${queue[0] + 1}`;
  $("q").textContent = c.q; $("a").textContent = c.a;
  $("numF").textContent = n; $("numB").textContent = n;
}

function answer(knew) {
  if (!flipped || !queue.length) return;
  const idx = queue.shift();
  if (knew) good++;
  else {
    again++;
    // Bring it back a few cards later
    const pos = Math.min(queue.length, 3 + Math.floor(Math.random() * 3));
    queue.splice(pos, 0, idx);
  }
  save(); render();
}

$("card").addEventListener("click", () => queue.length && setFlip(!flipped));
$("flipBtn").addEventListener("click", () => queue.length && setFlip(!flipped));
$("againBtn").addEventListener("click", () => answer(false));
$("goodBtn").addEventListener("click", () => answer(true));
$("shuffleBtn").addEventListener("click", () => { shuffle(queue); save(); render(); });
$("resetBtn").addEventListener("click", () => { if (confirm("İlerlemen sıfırlansın mı?")) start(true); });
$("restartBtn").addEventListener("click", () => start(true));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); queue.length && setFlip(!flipped); }
  else if (e.key === "1") answer(false);
  else if (e.key === "2") answer(true);
});

fetch("flashcards.csv")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => {
    cards = parseCSV(t.replace(/^﻿/, ""));
    if (!load()) start(true); else render();
  })
  .catch(() => {
    $("q").innerHTML = '<span class="error">Kartlar yüklenemedi.</span>';
  });
</script>
</body>
</html>
