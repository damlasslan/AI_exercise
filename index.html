<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapay Zekâ Egzersizleri</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a65;
    --line: #e4e2dc;
    --accent: #3b5bdb;
    --accent-soft: #e7ecff;
    --good: #2b8a3e;
    --good-soft: #e3f4e6;
    --bad: #c92a2a;
    --bad-soft: #fdeaea;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1d;
      --text: #ecebe6;
      --muted: #9d9b94;
      --line: #33322f;
      --accent: #8ca2ff;
      --accent-soft: #252c47;
      --good: #6fcf86;
      --good-soft: #1d3324;
      --bad: #ff8787;
      --bad-soft: #3a1f1f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  main { width: 100%; max-width: 640px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: .92rem; margin: 0; }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 10px; font-size: .85rem; }
  .pill {
    padding: 5px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.good b { color: var(--good); }
  .pill.bad b { color: var(--bad); }

  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; width: 0; background: var(--good); transition: width .3s ease; }

  .card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 40px 24px 28px; text-align: center;
  }
  .label {
    position: absolute; top: 14px; left: 18px;
    font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .num { position: absolute; top: 14px; right: 18px; font-size: .78rem; color: var(--muted); }
  .q { font-size: 1.25rem; font-weight: 600; line-height: 1.45; }

  .options { display: grid; gap: 10px; margin-top: 16px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    font: inherit; font-size: 1rem; line-height: 1.45; color: var(--text);
    background: var(--surface); border: 2px solid var(--line); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; width: 100%;
    transition: border-color .15s ease, background .15s ease, transform .08s ease;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt:disabled { cursor: default; }
  .opt .key {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: .8rem; font-weight: 700;
    background: var(--accent-soft); color: var(--accent);
  }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .key { background: var(--good); color: var(--surface); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .key { background: var(--bad); color: var(--surface); }
  .opt.dim { opacity: .55; }

  .feedback {
    display: none; margin-top: 14px; border-radius: 12px; padding: 14px 16px; line-height: 1.5;
    animation: pop .2s ease;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-soft); color: var(--good); }
  .feedback.bad { background: var(--bad-soft); }
  .feedback .title { font-weight: 700; font-size: 1.05rem; margin-bottom: 2px; }
  .feedback.bad .title { color: var(--bad); }
  .feedback.bad .why { color: var(--text); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  button.primary {
    font: inherit; font-size: .95rem; font-weight: 600; width: 100%; margin-top: 14px;
    border: none; background: var(--accent); color: #fff; padding: 13px 14px; border-radius: 12px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button.primary { color: #10152b; } }
  button.primary[hidden], button.retry[hidden] { display: none; }
  button.retry {
    font: inherit; font-size: .95rem; font-weight: 600; width: 100%; margin-top: 10px;
    border: 2px solid var(--bad); background: var(--surface); color: var(--bad);
    padding: 11px 14px; border-radius: 12px; cursor: pointer;
  }

  .nav { display: flex; justify-content: flex-end; margin-top: 14px; }
  .nav button {
    font: inherit; font-size: .85rem; font-weight: 500; color: var(--text);
    border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; cursor: pointer;
  }

  .keys { margin-top: 18px; font-size: .78rem; color: var(--muted); text-align: center; }
  kbd {
    font-family: inherit; font-size: .72rem; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--surface);
  }
  @media (hover: none) { .keys { display: none; } }

  .done {
    display: none; text-align: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 36px 24px; box-shadow: var(--shadow);
  }
  .done h2 { margin: 0 0 8px; }
  .done p { color: var(--muted); margin: 0 0 6px; }
  .done .score { font-size: 2.4rem; font-weight: 700; color: var(--good); margin: 8px 0; }
  .error { color: var(--bad); }

  [hidden] { display: none !important; }
  .back { display: inline-block; margin-bottom: 10px; font-size: .88rem; color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .menu { display: grid; gap: 12px; margin-top: 20px; }
  .topic {
    display: block; text-decoration: none; color: var(--text);
    background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 20px 22px;
    transition: border-color .15s ease, transform .08s ease;
  }
  .topic:hover { border-color: var(--accent); }
  .topic:active { transform: scale(.99); }
  .topic .t { font-size: 1.12rem; font-weight: 700; margin-bottom: 4px; }
  .topic .d { color: var(--muted); font-size: .92rem; line-height: 1.45; }
  .topic .p { margin-top: 12px; font-size: .85rem; font-weight: 600; color: var(--accent); }
  .topic .p.fin { color: var(--good); }
  .done a { display: inline-block; margin-top: 14px; font-size: .9rem; color: var(--accent); }

  @media (max-width: 480px) {
    .q { font-size: 1.1rem; }
    .opt { font-size: .95rem; padding: 12px 14px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <a class="back" id="backLink" href="./" hidden>← Tüm egzersizler</a>
    <h1 id="title">Yapay Zekâ Egzersizleri</h1>
    <p class="sub" id="sub">Çalışmak istediğin konuyu seç.</p>
  </header>

  <nav class="menu" id="menu" hidden></nav>

  <div id="quiz" hidden>
  <div class="stats">
    <span class="pill">Kalan <b id="sLeft">0</b></span>
    <span class="pill good">Doğru <b id="sGood">0</b></span>
    <span class="pill bad">Yanlış <b id="sBad">0</b></span>
    <span class="pill">Toplam <b id="sTotal">0</b></span>
  </div>
  <div class="bar"><div id="bar"></div></div>

  <section id="study">
    <div class="card">
      <span class="label">Soru</span><span class="num" id="num"></span>
      <div class="q" id="q">Sorular yükleniyor…</div>
    </div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <button class="retry" id="retryBtn" hidden>↻ Bu soruyu tekrar dene</button>
    <button class="primary" id="nextBtn" hidden>Sonraki soru →</button>

    <div class="nav"><button id="resetBtn">Baştan başla</button></div>
    <p class="keys"><kbd>A</kbd> / <kbd>B</kbd> şık seç · <kbd>Enter</kbd> sonraki soru · <kbd>R</kbd> tekrar dene</p>
  </section>

  <section class="done" id="done">
    <h2>Tebrikler, bitirdin! 🎉</h2>
    <p>İlk denemede doğru bildiğin sorular</p>
    <div class="score" id="score"></div>
    <p id="doneText"></p>
    <button class="primary" id="restartBtn" style="max-width:260px">Tekrar çöz</button>
    <br><a href="./">← Tüm egzersizler</a>
  </section>
  </div>
</main>

<script>
// Yeni konu eklemek için buraya bir satır ve depoya bir CSV dosyası ekleyin
const TOPICS = [
  { id: "temel", title: "Yapay Zekâ Temel Kavramlar", file: "sorular.csv", store: "yz-test-v1", ev: "",
    desc: "Zekâ, yapay zekâ, makine öğrenmesi, istem (prompt) ve beceriler." },
  { id: "hci", title: "YZ ve İnsan-Makine Etkileşimi", file: "sorular-hci.csv", store: "yz-test-hci-v1", ev: "hci-",
    desc: "Arayüz, kullanıcı deneyimi, bilişsel yük, Human-in-the-Loop ve etkileşim döngüsü." },
];
const topic = TOPICS.find(t => t.id === new URLSearchParams(location.search).get("konu"));
const STORE = topic ? topic.store : "";
let items = [], queue = [], good = 0, bad = 0, missed = [], answered = false, currentIdx = -1;

const $ = id => document.getElementById(id);

// GoatCounter olayları (reklam engelleyici varsa sessizce atlanır)
const pending = [];
function flush() {
  if (!(window.goatcounter && window.goatcounter.count)) return false;
  while (pending.length) { try { window.goatcounter.count(pending.shift()); } catch (e) {} }
  return true;
}
function track(path, title) {
  pending.push({ path: topic.ev + path, title: (topic.ev ? "[" + topic.title + "] " : "") + title, event: true });
  if (flush()) return;
  // Sayaç betiği henüz yüklenmediyse 15 saniyeye kadar bekle
  let tries = 0;
  const t = setInterval(() => { if (flush() || ++tries > 30) clearInterval(t); }, 500);
}

function parseCSV(text) {
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows
    .filter(r => r.length >= 4 && r[0].trim() && r[0].trim().toLowerCase() !== "soru")
    .map(r => ({ q: r[0].trim(), right: r[1].trim(), wrong: r[2].trim(), why: r[3].trim() }));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ n: items.length, queue, good, bad, missed })); } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && s.n === items.length && Array.isArray(s.queue)) {
      queue = s.queue; good = s.good; bad = s.bad; missed = s.missed || []; return true;
    }
  } catch (e) {}
  return false;
}

function start() {
  queue = shuffle(items.map((_, i) => i));
  good = 0; bad = 0; missed = [];
  save(); render();
  track("test-basladi", "Test başladı");
}

function stats() {
  const total = items.length;
  $("sLeft").textContent = queue.length;
  $("sGood").textContent = good;
  $("sBad").textContent = bad;
  $("sTotal").textContent = total;
  $("bar").style.width = total ? ((total - queue.length) / total * 100) + "%" : "0";
}

function render() {
  stats();
  answered = false;
  $("feedback").className = "feedback";
  $("nextBtn").hidden = true;
  $("retryBtn").hidden = true;

  if (!queue.length) {
    const total = items.length, first = total - missed.length;
    $("study").style.display = "none";
    $("done").style.display = "block";
    $("score").textContent = `${first} / ${total}`;
    $("doneText").textContent = missed.length
      ? `${missed.length} soruyu ilk seferde kaçırdın ama sonunda hepsini doğru cevapladın.`
      : "Hepsini ilk denemede bildin, harika!";
    return;
  }
  $("study").style.display = "";
  $("done").style.display = "none";

  const idx = queue[0], it = items[idx];
  $("q").textContent = it.q;
  $("num").textContent = `#${idx + 1}`;

  const opts = shuffle([{ text: it.right, ok: true }, { text: it.wrong, ok: false }]);
  const box = $("options");
  box.innerHTML = "";
  opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.dataset.ok = o.ok ? "1" : "0";
    const k = document.createElement("span"); k.className = "key"; k.textContent = "AB"[i];
    const t = document.createElement("span"); t.textContent = o.text;
    b.append(k, t);
    b.addEventListener("click", () => choose(b));
    box.appendChild(b);
  });
}

function choose(btn) {
  if (answered) return;
  answered = true;
  const idx = queue[0], it = items[idx], ok = btn.dataset.ok === "1";
  currentIdx = idx;
  const buttons = [...$("options").children];
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.ok === "1") b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb = $("feedback");
  fb.innerHTML = "";
  const title = document.createElement("div"); title.className = "title";
  if (ok) {
    fb.className = "feedback show good";
    title.textContent = "✓ Doğru!";
    fb.append(title);
    good++;
    queue.shift();
    if (!queue.length) {
      const first = items.length - missed.length;
      track("test-bitti", "Test bitti");
      track("skor-" + first, "Skor (ilk deneme): " + first + "/" + items.length);
    }
  } else {
    fb.className = "feedback show bad";
    title.textContent = "✗ Yanlış";
    const why = document.createElement("div"); why.className = "why";
    why.textContent = "Neden yanlış: " + it.why;
    fb.append(title, why);
    bad++;
    track("yanlis-soru-" + (idx + 1), "Yanlış #" + (idx + 1) + ": " + it.q);
    if (!missed.includes(idx)) missed.push(idx);
    queue.shift();
    // Soruyu birkaç soru sonra tekrar sor
    const pos = Math.min(queue.length, 3 + Math.floor(Math.random() * 3));
    queue.splice(pos, 0, idx);
    $("retryBtn").hidden = false;
  }
  stats();
  save();
  $("nextBtn").hidden = false;
  $("nextBtn").focus();
}

$("nextBtn").addEventListener("click", render);
$("retryBtn").addEventListener("click", () => {
  // Az önce yanlış cevaplanan soruyu sıranın başına al
  const idx = queue.lastIndexOf(currentIdx);
  if (idx > -1) queue.splice(idx, 1);
  queue.unshift(currentIdx);
  save(); render();
});
$("resetBtn").addEventListener("click", () => { if (confirm("İlerlemen sıfırlansın mı?")) start(); });
$("restartBtn").addEventListener("click", start);
document.addEventListener("keydown", e => {
  if (!topic || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (!answered && (k === "a" || k === "b" || k === "1" || k === "2")) {
    const i = (k === "a" || k === "1") ? 0 : 1;
    const b = $("options").children[i];
    if (b) choose(b);
  } else if (answered && k === "r" && !$("retryBtn").hidden) {
    $("retryBtn").click();
  } else if (answered && e.key === "Enter" && e.target !== $("nextBtn")) {
    e.preventDefault(); render();
  }
});

function showMenu() {
  const menu = $("menu");
  TOPICS.forEach(t => {
    const a = document.createElement("a");
    a.className = "topic"; a.href = "?konu=" + t.id;
    const ti = document.createElement("div"); ti.className = "t"; ti.textContent = t.title;
    const d = document.createElement("div"); d.className = "d"; d.textContent = t.desc;
    const p = document.createElement("div"); p.className = "p"; p.textContent = "Başla →";
    try {
      const st = JSON.parse(localStorage.getItem(t.store));
      if (st && Array.isArray(st.queue)) {
        const doneN = st.n - st.queue.length;
        if (!st.queue.length) { p.textContent = "✓ Tamamlandı · tekrar çöz →"; p.classList.add("fin"); }
        else if (doneN > 0 || st.bad > 0) p.textContent = `Devam et → (${doneN} / ${st.n})`;
      }
    } catch (e) {}
    a.append(ti, d, p);
    menu.appendChild(a);
  });
  menu.hidden = false;
}

if (!topic) {
  showMenu();
} else {
  document.title = topic.title;
  $("title").textContent = topic.title;
  $("sub").textContent = "Her soruda iki cevap var, doğru olanı seç. Yanlış bildiğin sorular birkaç soru sonra tekrar gelir.";
  $("backLink").hidden = false;
  $("quiz").hidden = false;
  fetch(topic.file)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => {
      items = parseCSV(t.replace(/^\uFEFF/, ""));
      if (!load()) start(); else render();
    })
    .catch(() => {
      $("q").innerHTML = '<span class="error">Sorular yüklenemedi.</span>';
    });
}
</script>
<script data-goatcounter="https://aiexercise-damlahoca.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
